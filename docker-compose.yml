services:
  frontend:
    build:
      # Context is the monorepo root so the pnpm lockfile, workspace manifest
      # and the frontend package are all available to the build.
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: unitabling-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
